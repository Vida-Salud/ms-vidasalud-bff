server:
  port: 8090

spring:
  config:
    import: optional:file:.env[.properties]   # solo para correr desde el IDE
  application:
    name: ms-vidasalud-bff

  mvc:
    apiversion:
      use:
        path-segment: 1
      supported: 1
  http:
    serviceclient:
      appointments:
        base-url: ${APPOINTMENTS_URL:http://localhost:8081}
        connect-timeout: 2s
        read-timeout: 5s
      catalog:
        base-url: ${CATALOG_URL:http://localhost:8091}
        connect-timeout: 2s
        read-timeout: 5s
      report:
        base-url: ${REPORT_URL:http://localhost:8094}
        connect-timeout: 2s
        read-timeout: 5s
      audit:
        base-url: ${AUDIT_URL:http://localhost:8096}
        connect-timeout: 2s
        read-timeout: 5s

  cloud:
    azure:
      active-directory:
        enabled: true
        profile:
          tenant-id: ${AZURE_TENANT_ID}
        credential:
          client-id: ${AZURE_CLIENT_ID}
        app-id-uri: ${AZURE_APP_ID_URI:api://${AZURE_CLIENT_ID}}

vidasalud:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}   # lista separada por comas
  # Proxies de confianza delante del BFF, para saber qué valor de X-Forwarded-For es el cliente real.
  # 0 en local (el navegador habla directo con el BFF); 1 en AWS, detrás del API Gateway.
  proxies-de-confianza: ${PROXIES_DE_CONFIANZA:0}

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

management:
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness y /actuator/health/readiness
