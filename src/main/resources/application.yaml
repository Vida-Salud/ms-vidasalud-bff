server:
  port: 8090

spring:
  config:
    import: optional:file:.env[.properties]   # solo para correr desde el IDE
  application:
    name: ms-vidasalud-bff

  cloud:
    azure:
      active-directory:
        enabled: true
        profile:
          tenant-id: ${AZURE_TENANT_ID}
        credential:
          client-id: ${AZURE_CLIENT_ID}
        app-id-uri: ${AZURE_APP_ID_URI:api://${AZURE_CLIENT_ID}}

vidasalud:
  services:
    appointments-url: ${APPOINTMENTS_URL:http://localhost:8081}
    catalog-url: ${CATALOG_URL:http://localhost:8091}
